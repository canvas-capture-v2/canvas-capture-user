apiVersion: v1
kind: PersistentVolume
metadata:
  name: user-pv-volume
  labels:
    type: local
spec:
  storageClassName: standard
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: '/mnt/data/user'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-pv-claim
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi